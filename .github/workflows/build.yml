name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android platform and build tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ls "$ANDROID_HOME" "$ANDROID_HOME/platforms" || true
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: .github/scripts/gradle.sh testDebugUnitTest

      - name: Build debug APK
        run: .github/scripts/gradle.sh assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: spamblocker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Rolling "latest" release so the APK can be downloaded straight from the phone.
      - name: Publish latest APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SpamBlocker.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SpamBlocker.apk \
            --title "Latest build" \
            --notes "Debug build of ${GITHUB_SHA::7}. Open this page on your phone and tap SpamBlocker.apk to install." \
            --prerelease
